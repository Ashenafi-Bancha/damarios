# Local PostgreSQL for development.
# Start:  docker compose up -d
# It listens on port 5436 so it does not clash with a PostgreSQL already installed on 5432.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: damarios
      POSTGRES_PASSWORD: damarios
      POSTGRES_DB: damarios
    ports:
      - "5436:5432"
    # Lets "docker compose up --wait" (npm run db:up) return only once the database accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damarios -d damarios"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
